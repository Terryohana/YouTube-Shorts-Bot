name: Auto YouTube Shorts Pipeline

on:
  schedule:
    - cron: '0 8 * * *'  # 8:00 AM UTC
    - cron: '0 20 * * *' # 8:00 PM UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies for MoviePy and Edge-TTS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Decode YouTube Authentication Secrets
        env:
          GOOGLE_CLIENT_SECRETS_BASE64: ${{ secrets.GOOGLE_CLIENT_SECRETS_BASE64 }}
          GOOGLE_TOKEN_PICKLE_BASE64: ${{ secrets.GOOGLE_TOKEN_PICKLE_BASE64 }}
        run: |
          mkdir -p .agents/skills/youtube-uploader/credentials
          echo "$GOOGLE_CLIENT_SECRETS_BASE64" | base64 --decode > .agents/skills/youtube-uploader/credentials/client_secrets.json
          echo "$GOOGLE_TOKEN_PICKLE_BASE64" | base64 --decode > .agents/skills/youtube-uploader/credentials/token.pickle

      - name: Run Pipeline
        run: |
          cd video-projects
          python autonomous_pipeline.py

      - name: Commit and push used topics state
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add video-projects/used_topics.json
          git commit -m "chore: update used_topics.json [skip ci]" || echo "No changes to commit"
          git push
